name: apiome-openapi

# Publishes the REST OpenAPI document to the live catalog, so it runs only for `main`: a pull
# request or a feature-branch push must never import an unmerged spec. It triggers only when
# openapi.yaml or openapi.json itself changes: an import of an unchanged spec re-uploads a version
# the catalog already holds and fails. Use workflow_dispatch to re-run it by hand.
on:
  push:
    branches: [ main ]
    paths:
      - "apiome-rest/openapi.yaml"
      - "apiome-rest/openapi.json"
  workflow_dispatch:

jobs:
  publish:
    runs-on: self-hosted
    env:
      # Saved repository secrets consumed directly by the CLI (APIOME_ env prefix).
      APIOME_BASE_URL: ${{ secrets.APIOME_BASE_URL }}
      APIOME_TENANT_ID: ${{ secrets.APIOME_TENANT_ID }}
      APIOME_API_KEY: ${{ secrets.APIOME_API_KEY }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      # Python comes from uv, not actions/setup-python: the CPython builds setup-python
      # downloads for Ubuntu 26.04 declare `x86 ISA needed: x86-64-v3`, which the self-hosted
      # runner's vCPU does not provide, so they abort with "CPU ISA level is lower than
      # required". uv's python-build-standalone builds are baseline x86-64.
      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true
          python-version: "3.12"

      - name: Set up Python
        run: uv python install

      # Fail fast, with its own step name, when the runner cannot reach the catalog server (down,
      # wrong APIOME_BASE_URL, blocked by a firewall). `doctor` is the CLI's anonymous `GET /health`
      # probe, so a green step here and a red import below means the server was reachable and the
      # import itself did not finish.
      - name: Check the catalog server is reachable
        run: |
          cd apiome-cli
          uv sync
          ./run.sh doctor
        env:
          APIOME_LOAD_DOTENV: "0"

      - name: Build CLI and push OpenAPI to catalog
        run: |
          cd apiome-cli
          uv sync
          # Base URL, tenant, and API key come from the saved APIOME_* secrets above. The JSON
          # document is the one imported: the YAML twin of the same spec faults the import worker.
          # --allow-breaking: the REST API is versioned and its breaking changes are reviewed in the PR that makes
          # them, so the publish must not be blocked by the breaking-change gate (409). Other publish checks apply.
          ./run.sh import openapi ../apiome-rest/openapi.json --publish public --allow-breaking --poll-interval 1 --import-timeout 900
        env:
          APIOME_LOAD_DOTENV: "0"
