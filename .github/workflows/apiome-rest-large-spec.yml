name: Apiome REST Large-Spec Benchmarks

# Runs the COA-5.11 large-spec benchmark (#7087): GitHub-, Stripe- and Azure-shaped OpenAPI
# revisions and a 50 MB synthetic one go through cold and warm schema, classified diff,
# compatibility and export stages. Each stage's wall-clock and peak memory is held to the committed
# baseline in apiome-rest/tests/scale/large_spec_budgets.json, and two absolute targets apply to the
# public-API-sized fixtures: a warm diff of two large revisions under 2 s, a warm /v1/schema read
# under 200 ms. A warm stage that runs the OpenAPI generator also fails the run.
#
# Scheduled nightly, not per-PR: the 50 MB fixture takes minutes and gigabytes. The per-PR check is
# tests/test_large_spec_harness.py, which runs a tiny fixture through every stage in the normal suite.
#
# Refreshing the baseline: run the workflow manually with update_baseline = true, download the
# large-spec-baseline artifact and commit it — or, locally,
#   RUN_LARGE_SPEC_SUITE=1 uv run pytest tests/test_large_spec_benchmark.py --update-large-spec-budgets

on:
  schedule:
    # 05:15 UTC every night, after the scale benchmarks (04:15, apiome-rest-scale.yml) so the two
    # never share the runner and the timings stay comparable.
    - cron: '15 5 * * *'
  workflow_dispatch:
    inputs:
      regression_margin:
        description: 'Wall-clock regression margin (multiplier over the baseline).'
        required: false
        default: ''
      memory_margin:
        description: 'Peak-memory regression margin (multiplier over the baseline).'
        required: false
        default: ''
      update_baseline:
        description: 'Rewrite the committed baseline from this run and upload it.'
        type: boolean
        required: false
        default: false

jobs:
  large-spec:
    name: large-spec benchmarks
    runs-on: self-hosted
    timeout-minutes: 120
    # The suite never touches the database (revisions live in memory); clearing this keeps a host
    # DATABASE_URL out of the run. Margins are shared with the scale suite's overrides.
    env:
      DATABASE_URL: ""
      RUN_LARGE_SPEC_SUITE: "1"
      SCALE_REGRESSION_MARGIN: ${{ inputs.regression_margin }}
      SCALE_MEMORY_MARGIN: ${{ inputs.memory_margin }}
    defaults:
      run:
        working-directory: apiome-rest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      # Python comes from uv, not actions/setup-python: the CPython builds setup-python
      # downloads for Ubuntu 26.04 declare `x86 ISA needed: x86-64-v3`, which the self-hosted
      # runner's vCPU does not provide, so they abort with "CPU ISA level is lower than
      # required". uv's python-build-standalone builds are baseline x86-64.
      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true
          python-version: "3.12"

      - name: Set up Python
        run: uv python install

      - name: Install dependencies (incl. dev/test group)
        run: uv sync

      - name: Run the large-spec benchmarks
        run: |
          uv run pytest tests/test_large_spec_benchmark.py -v \
            ${{ inputs.update_baseline && '--update-large-spec-budgets' || '' }} \
            --junitxml=large-spec-report.xml

      - name: Benchmark summary
        if: always()
        run: |
          {
            echo '### apiome-rest large-spec benchmarks'
            echo ''
            echo '| fixture | stage | wall (ms) | vs budget | peak (MiB) | vs budget |'
            echo '| --- | --- | ---: | ---: | ---: | ---: |'
            uv run python - <<'PY'
          import json
          from pathlib import Path

          report = Path("reports/large-spec-benchmark.json")
          if not report.exists():
              print('| _no report artifact_ | | | | | |')
              raise SystemExit(0)
          payload = json.loads(report.read_text())
          for fixture in payload["fixtures"]:
              for stage, values in fixture["stages"].items():
                  wall_ratio = values.get("wall_ratio")
                  peak_ratio = values.get("peak_ratio")
                  print(
                      f'| {fixture["name"]} | {stage} | {values["wall_ms"]:.1f} | '
                      f'{"—" if wall_ratio is None else f"{wall_ratio:.2f}x"} | '
                      f'{values["peak_bytes"] / 1024 / 1024:.1f} | '
                      f'{"—" if peak_ratio is None else f"{peak_ratio:.2f}x"} |'
                  )
          for miss in payload.get("target_misses", []):
              print(f'| **target missed** | {miss["fixture"]} · {miss["stage"]} | {miss["measured_ms"]:.0f} | limit {miss["limit_ms"]:.0f} | | |')
          PY
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload benchmark report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: apiome-rest-large-spec-report
          path: |
            apiome-rest/reports/large-spec-benchmark.json
            apiome-rest/large-spec-report.xml
          if-no-files-found: warn

      - name: Upload refreshed baseline
        if: always() && inputs.update_baseline
        uses: actions/upload-artifact@v7
        with:
          name: apiome-rest-large-spec-baseline
          path: apiome-rest/tests/scale/large_spec_budgets.json
          if-no-files-found: warn
