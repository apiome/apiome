name: Apiome Docs

# Runs the docs gate (`yarn docs:check`) on every pull request — documentation is part of the
# definition of done (DOCS-1.13, #5630), and a change anywhere (an apiome-ui route, a REST endpoint)
# can leave a page, a screenshot or a generated reference stale. Deploys the site to GitHub Pages
# from `main`. The apiome-docs Docker image (nginx serving the static build) is built and
# smoke-tested on pull requests that touch its inputs; apiome-docs-publish.yml pushes it to the
# registry from `main`.
#
# One-time repository setting: Settings → Pages → Build and deployment → Source: "GitHub Actions".

on:
  push:
    branches: [ main ]
    paths:
      - 'apiome-docs/**'
      - 'docs/**'
      - 'package.json'
      - 'yarn.lock'
      - '.dockerignore'
      - '.github/workflows/apiome-docs.yml'
      # Sources of the generated reference (DOCS-1.11): a change here can leave a page stale.
      - 'apiome-rest/openapi.yaml'
      - 'apiome-rest/src/app/rest_reference_doc.py'
      - 'apiome-cli/src/**'
      - 'apiome-mcp/src/**'
      - 'diff-action/README.md'
      - 'mock-action/README.md'
      # Sources of the release notes (DOCS-1.12): "Unreleased" is regenerated on every build.
      - 'apiome-rest/CHANGELOG.md'
      - 'apiome-ui/public/WHATS_NEW.md'
      - 'scripts/gen-release-notes.ts'
  # Every pull request, whatever it touches: the gate is what keeps the docs current.
  pull_request:
    branches: [ main, develop ]
  # Allow manual trigger (deploys when run on main)
  workflow_dispatch:

permissions:
  contents: read

# One Pages deployment at a time; a newer push supersedes a queued one but never cancels a
# deployment already in progress.
concurrency:
  group: apiome-docs-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Check and Build Apiome Docs
    runs-on: self-hosted

    steps:
      # Full history: the stale-screenshot rule compares each image's last commit with its route's.
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Enable Corepack and set Yarn to 4.12.0
        run: corepack enable && corepack prepare yarn@4.12.0 --activate

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Install dependencies
        run: yarn install --immutable

      # Product docs belong on the site: a new loose .md under apiome-*/docs/ fails, and the legacy
      # docs inventory (docs/archive/INVENTORY.md) must match the tree (DOCS-1.14, #5631).
      - name: Loose-docs lint
        run: |
          bash scripts/check-loose-docs.sh
          python3 scripts/legacy_docs_inventory.py --check
          python3 -m unittest scripts/tests/test_loose_docs.py

      - name: Run docs unit tests
        run: yarn workspace apiome-docs test

      - name: Type-check
        run: yarn workspace apiome-docs typecheck

      # Page rules, then the production build (broken links and anchors fail it).
      - name: Check and build the site
        run: yarn docs:check

      - name: Upload Pages artifact
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v4
        with:
          path: apiome-docs/build

  # The REST, CLI and MCP reference pages are generated from source (DOCS-1.11, #5628). Each
  # generator re-renders in memory with --check and fails when a committed page differs, so a
  # change to the OpenAPI document, the command tree or the tool registry cannot ship without
  # its reference.
  reference:
    name: Generated reference is current
    runs-on: self-hosted

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      # Python comes from uv (see apiome-mcp.yml for why not setup-python). No python-version
      # pin: each project resolves its own from pyproject.toml.
      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: REST reference (apiome-rest/openapi.yaml)
        working-directory: apiome-rest
        run: |
          uv sync --frozen
          uv run python scripts/generate_rest_reference_docs.py --check

      - name: CLI reference (the apiome command tree)
        working-directory: apiome-cli
        run: |
          uv sync --frozen
          uv run python scripts/generate_cli_reference_docs.py --check

      - name: MCP reference (the MCP server registry)
        working-directory: apiome-mcp
        run: |
          uv sync --frozen
          uv run python scripts/generate_mcp_reference_docs.py --check

      - name: CI action pages (diff-action / mock-action READMEs)
        run: node apiome-docs/scripts/sync-action-pages.mjs --check

  deploy:
    name: Deploy Apiome Docs to GitHub Pages
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: [build, reference]
    runs-on: self-hosted

    permissions:
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  # The gate runs on every pull request, but the image only needs rebuilding when its inputs moved.
  # (On `main`, apiome-docs-publish.yml decides that with its own path filter.)
  changes:
    name: Did the image's inputs change
    if: github.event_name == 'pull_request'
    runs-on: self-hosted
    outputs:
      image: ${{ steps.diff.outputs.image }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Compare with the base branch
        id: diff
        run: |
          set -euo pipefail
          changed=$(git diff --name-only "origin/${{ github.base_ref }}...HEAD")
          if echo "$changed" | grep -qE '^(apiome-docs/|docs/|package\.json$|yarn\.lock$|\.dockerignore$|\.github/workflows/apiome-docs\.yml$|apiome-rest/CHANGELOG\.md$|apiome-ui/public/WHATS_NEW\.md$|scripts/(gen-release-notes\.ts|package\.json)$)'; then
            echo "image=true" >> "$GITHUB_OUTPUT"
          else
            echo "image=false" >> "$GITHUB_OUTPUT"
          fi

  # Pull requests prove the image builds and serves the site; apiome-docs-publish.yml builds it
  # again on `main` and pushes it to the registry.
  image:
    name: Build and smoke-test apiome-docs image
    needs: [build, changes]
    if: github.event_name == 'pull_request' && needs.changes.outputs.image == 'true'
    runs-on: self-hosted
    env:
      IMAGE_TAG: apiome-docs:pr-${{ github.sha }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        run: |
          chmod +x .github/scripts/setup-buildx-self-hosted.sh
          .github/scripts/setup-buildx-self-hosted.sh

      # Build from the repository root: the docs workspace installs against the root lockfile.
      - name: Build Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./apiome-docs/Dockerfile
          push: false
          load: true
          platforms: linux/amd64
          provenance: false
          sbom: false
          tags: ${{ env.IMAGE_TAG }}

      - name: Smoke-test the image
        run: |
          set -euo pipefail
          cid=$(docker run -d --rm -p 127.0.0.1::8080 "$IMAGE_TAG")
          trap 'docker stop "$cid" >/dev/null; docker image rm "$IMAGE_TAG" >/dev/null 2>&1 || true' EXIT
          port=$(docker port "$cid" 8080/tcp | head -1 | sed 's/.*://')
          for _ in $(seq 1 20); do
            curl -fsS "http://127.0.0.1:${port}/healthz" >/dev/null 2>&1 && break
            sleep 1
          done
          curl -fsS "http://127.0.0.1:${port}/" | grep -q '<title>'
          curl -fsS "http://127.0.0.1:${port}/release-notes" | grep -q 'Release notes'
