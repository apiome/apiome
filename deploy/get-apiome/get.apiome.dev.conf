# nginx site for get.apiome.dev — vends the files in /var/www/get.apiome.dev.
#
#   https://get.apiome.dev            → install.sh (so `curl -fsSL https://get.apiome.dev | sh` works)
#   https://get.apiome.dev/<file>     → /var/www/get.apiome.dev/<file>
#
# `get-apiome-installer.sh refresh` (beside this file) keeps install.sh, install.sh.prev and
# install.sh.sha256 in that folder current.
#
# Install (Debian/Ubuntu layout):
#   sudo cp get.apiome.dev.conf /etc/nginx/sites-available/get.apiome.dev
#   sudo ln -sf /etc/nginx/sites-available/get.apiome.dev /etc/nginx/sites-enabled/
#   sudo certbot certonly --webroot -w /var/www/get.apiome.dev -d get.apiome.dev   # first time only
#   sudo nginx -t && sudo systemctl reload nginx
#
# Before the first certificate exists, nginx -t fails on the 443 block: comment it out, reload,
# run certbot, then restore it.

server {
    listen 80;
    listen [::]:80;
    server_name get.apiome.dev;

    # Let's Encrypt HTTP-01 challenges (certbot --webroot).
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/get.apiome.dev;
        default_type text/plain;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name get.apiome.dev;

    ssl_certificate     /etc/letsencrypt/live/get.apiome.dev/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/get.apiome.dev/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    root /var/www/get.apiome.dev;
    autoindex off;
    charset utf-8;

    # Scripts and checksums read as text in a browser and pipe cleanly into sh.
    types {
        text/plain sh sha256 prev txt;
    }
    default_type application/octet-stream;

    add_header Cache-Control "public, max-age=300" always;
    add_header X-Content-Type-Options "nosniff" always;

    # The bare host name returns the installer.
    location = / {
        try_files /install.sh =404;
        default_type text/plain;
    }

    # Hidden files (the refresh's in-progress .install.sh.XXXXXX downloads, .git, …) are never served.
    location ~ /\. {
        return 404;
    }

    location / {
        try_files $uri =404;
    }
}
