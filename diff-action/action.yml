name: Apiome Diff Gate
description: >
  Run apiome diff against a published project version, fail the check on
  breaking (or warn-level) changes, and upsert one sticky PR comment with the
  markdown changelog and the spec's suggested lint fixes.
author: Apiome

branding:
  icon: git-pull-request
  color: blue

inputs:
  spec:
    description: Path to the candidate OpenAPI YAML/JSON file (workspace-relative).
    required: true
  project:
    description: Baseline as project@version|latest (e.g. payments-api@latest).
    required: true
  fail-on:
    description: Gate threshold — breaking (default) or warn.
    required: false
    default: breaking
  api-key:
    description: Apiome API key (X-API-Key). Prefer a repository secret.
    required: true
  tenant:
    description: Tenant slug or UUID (APIOME_TENANT_ID).
    required: true
  base-url:
    description: Apiome REST base URL (APIOME_BASE_URL).
    required: false
    default: https://api.apiome.dev
  github-token:
    description: Token used to create/update the sticky PR comment.
    required: false
    default: ${{ github.token }}
  comment:
    description: When true, upsert a sticky PR comment with the markdown changelog.
    required: false
    default: "true"
  blast-radius:
    description: >
      When true (default), each breaking change in the changelog says what it affects:
      "affects N consumers across M teams (…); K verification runs invalidated". Needs projects:view.
    required: false
    default: "true"
  consumers:
    description: >
      When true (default), the changelog gains a "Consumer impact" section: which registered
      consumers of the baseline project each change breaks, including the consumers the Pact
      Broker feeds (a pacticipant bound to a consumer, with its published pact). Needs
      projects:view.
    required: false
    default: "true"
  mode:
    description: >
      Compatibility mode the changes are graded under: backward, forward, full or none
      (optionally with _transitive, e.g. full_transitive). Applies to Avro, JSON Schema and
      AsyncAPI baselines. Empty (default) uses the project's style-guide policy.
    required: false
    default: ""
  transitive:
    description: >
      true to also compare against every earlier version of the baseline, false to compare
      against the baseline only. Empty (default) uses the project's style-guide policy.
    required: false
    default: ""
  category:
    description: >
      Protobuf buf breaking category: wire, wire_json, package or file. Empty (default) uses the
      project's style-guide policy.
    required: false
    default: ""
  fix-suggestions:
    description: >
      When true (default), add a "Suggested fixes" section to the sticky comment (per rule the
      count, fix class and first hunk), post GitHub suggestion blocks for single-region fixes on
      lines the PR changes, and write the full patch and overlay (outputs fix-patch-path and
      fix-overlay-path) for an upload-artifact step. Never changes the exit code; nothing is
      pushed to the branch.
    required: false
    default: "true"

outputs:
  exit-code:
    description: Exit code from apiome diff (0 = pass, 1 = gate failed, 2 = error).
  changelog-path:
    description: Path to the written markdown changelog file inside the workspace.
  fix-count:
    description: Number of ready lint fixes suggested for the spec (empty when they could not be computed).
  fix-patch-path:
    description: Workspace path of the full RFC 6902 fix patch (same bytes as the plan's format=patch).
  fix-overlay-path:
    description: Workspace path of the same change as an Overlay 1.0 document.

runs:
  using: docker
  image: Dockerfile
  env:
    INPUT_SPEC: ${{ inputs.spec }}
    INPUT_PROJECT: ${{ inputs.project }}
    INPUT_FAIL_ON: ${{ inputs.fail-on }}
    INPUT_API_KEY: ${{ inputs.api-key }}
    INPUT_TENANT: ${{ inputs.tenant }}
    INPUT_BASE_URL: ${{ inputs.base-url }}
    INPUT_GITHUB_TOKEN: ${{ inputs.github-token }}
    INPUT_COMMENT: ${{ inputs.comment }}
    INPUT_BLAST_RADIUS: ${{ inputs.blast-radius }}
    INPUT_CONSUMERS: ${{ inputs.consumers }}
    INPUT_MODE: ${{ inputs.mode }}
    INPUT_TRANSITIVE: ${{ inputs.transitive }}
    INPUT_CATEGORY: ${{ inputs.category }}
    INPUT_FIX_SUGGESTIONS: ${{ inputs.fix-suggestions }}
