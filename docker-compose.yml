# Local spine stack: Postgres 16 (persistent volume), schema migrations, dev seed, apiome-rest
# (HTTP API) and apiome-mcp (HTTP). This is the stack exercised by the end-to-end golden-path
# smoke test (scripts/golden_path/, docs/GOLDEN_PATH.md).
# From repo root:
#   docker compose up --build --wait
#
# Services:
#   postgres  Postgres 16 with a persistent volume.
#   migrate   One-shot Flyway migrations (runs to completion, then exits).
#   seed      One-shot dev seed data (sample tenant `acme-corp` + API key); runs after migrate.
#   rest      apiome-rest FastAPI service on :8000 (depends on migrate + seed).
#   mcp       apiome-mcp HTTP service on :8765 (depends on migrate + seed).
#   mock      apiome-mock HTTP service on :8775 (depends on migrate + seed).
#   minio     MinIO (S3-compatible object storage) on :9000, console on :9001, persistent volume.
#   minio-init  One-shot: creates the document-store bucket in MinIO, then exits.
#   redpanda  Opt-in single-node Redpanda (Kafka API) for AsyncAPI mocks, profile `broker` only:
#               docker compose --profile broker up --build --wait
#             Off by default; no service depends on it (XPC-2.1, #5735).
#
# Document store (COA-5.12, #7088): rest keeps imported originals and rendered documents in
# `APIOME_DOCUMENT_STORE` = db (default, nothing to set up) | s3 | filesystem. MinIO is always
# started and pre-wired, so a working S3 store is one line in `.env`:
#   APIOME_DOCUMENT_STORE=s3
#
# Override secrets via environment or a `.env` file (see docker-compose.env.example).

services:
  postgres:
    # pgvector/pgvector ships Postgres 16 with the `vector` extension preinstalled, which the
    # schema requires (V001 `CREATE EXTENSION vector`; embedding columns/HNSW indexes in V062/V102).
    # Plain `postgres:16-bookworm` lacks it and fails the first migration.
    image: pgvector/pgvector:pg16-bookworm
    # Slow-query visibility (DBP-1.1, #7184): pg_stat_statements collects per-statement totals (run
    # `CREATE EXTENSION IF NOT EXISTS pg_stat_statements` once to read them) and auto_explain logs the
    # plan of any statement slower than POSTGRES_AUTO_EXPLAIN_MIN_DURATION (`-1` turns it off). See
    # apiome-docs/docs/admin/operating-apiome.mdx, "Find slow queries".
    command:
      - postgres
      - -c
      - shared_preload_libraries=pg_stat_statements,auto_explain
      - -c
      - pg_stat_statements.track=top
      - -c
      - auto_explain.log_min_duration=${POSTGRES_AUTO_EXPLAIN_MIN_DURATION:-1s}
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-apiome_local_dev}
      POSTGRES_DB: ${POSTGRES_DB:-apiome}
    volumes:
      - apiome_postgres_data:/var/lib/postgresql/data
    ports:
      - "${POSTGRES_PUBLISH_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 15s
    networks:
      - apiome-mcp

  migrate:
    build:
      context: ./apiome-db
      dockerfile: Dockerfile
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-apiome_local_dev}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_DB: ${POSTGRES_DB:-apiome}
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"
    networks:
      - apiome-mcp

  # One-shot dev seed (sample tenant `acme-corp`, sample user, dev API key). Runs after migrations
  # complete and exits. NODE_ENV is forced to development so the seed guard (which refuses to load
  # dev data under NODE_ENV=production) allows it. Seed SQL is idempotent (ON CONFLICT DO NOTHING).
  seed:
    build:
      context: ./apiome-db
      dockerfile: Dockerfile
    command: ["seed"]
    environment:
      NODE_ENV: development
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-apiome_local_dev}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_DB: ${POSTGRES_DB:-apiome}
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    restart: "no"
    networks:
      - apiome-mcp

  # apiome-rest FastAPI service. The golden-path smoke test drives import / edit / version /
  # publish / browse / export through this service (the same endpoints the UI calls).
  rest:
    build:
      # Repo root context so the Dockerfile can pull in the apiome-ui workspace (the
      # spec-import worker runs as a tsx script from apiome-ui).
      context: .
      dockerfile: apiome-rest/Dockerfile
    ports:
      - "${APIOME_REST_HTTP_PORT:-8000}:8000"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-apiome_local_dev}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_DB: ${POSTGRES_DB:-apiome}
      # The HS256 secret apiome-ui signs its REST JWTs with; must match apiome-ui's value. Empty ⇒
      # unset ⇒ REST's insecure local fallback. Without this line a stack started with a real
      # secret (the CI journeys) rejects every UI request with 401.
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:-}
      APIOME_MOCK_PUBLIC_BASE_URL: ${APIOME_MOCK_PUBLIC_BASE_URL:-http://localhost:8775}
      # `apiome login` (#5501): where people open /cli/login to approve a CLI sign-in.
      APIOME_UI_PUBLIC_URL: ${APIOME_UI_PUBLIC_URL:-http://localhost:3000}
      # Notification email (#6384, catalog drift email): the same SendGrid sender as apiome-ui.
      # Optional pass-throughs (empty ⇒ unset ⇒ nothing is emailed; every other channel still works).
      SENDGRID_API_KEY: ${SENDGRID_API_KEY:-}
      EMAIL_FROM: ${EMAIL_FROM:-}
      # ── Dry-run mock preview (#5528, MSC-1.2) ───────────────────────────────────────────────
      # POST …/mock/preview renders a synthetic request through apiome-mock's *own* serving path
      # rather than re-implementing it here, so REST needs the mock service's INTERNAL address
      # (compose DNS on the shared network — never the public URL above) plus a shared token both
      # containers hold. Both are required: with either unset the preview endpoint fails closed
      # with 503 and the mock side refuses to render for an unauthenticated caller. Deliberately
      # not INTERNAL_SERVICE_TOKEN — rendering a preview should not carry the secret that unseals
      # auth-provider credentials.
      APIOME_MOCK_INTERNAL_BASE_URL: ${APIOME_MOCK_INTERNAL_BASE_URL:-http://mock:8775}
      APIOME_MOCK_INTERNAL_TOKEN: ${APIOME_MOCK_INTERNAL_TOKEN:-apiome-local-dev-preview-token}
      # ── DB-over-env sign-in provider configuration (OLO-8.3/8.4/8.5) ────────────────────────
      # A compose service only receives the variables listed here, and there is no `env_file`,
      # so anything absent from this block is simply not in the container no matter what the
      # operator's .env says. All five are optional pass-throughs (empty ⇒ unset), but each
      # missing one silently disables a step of the admin-configured provider path, and every
      # failure in that path degrades to env-configured providers rather than erroring:
      #
      #   ADMIN_SESSION_SECRET / ADMIN_PASSWORD  verify the /admin portal's signed session, so
      #       GET/PUT /v1/admin/auth-providers can be served at all. With neither set that
      #       surface fails closed and every save is rejected. Must match apiome-ui's values.
      #   AUTH_CONFIG_ENC_KEY                    seals the client secret before it is stored.
      #       Without it, saving a secret is a 503 ("secret encryption is not configured").
      #   INTERNAL_SERVICE_TOKEN                 gates GET /v1/internal/auth-providers/resolved,
      #       the login-time read apiome-ui merges over env. Unset ⇒ 503 ⇒ sign-in keeps using
      #       GITHUB_ID/GITHUB_SECRET and the admin screen appears to do nothing. Must match
      #       apiome-ui's INTERNAL_SERVICE_TOKEN byte for byte.
      ADMIN_SESSION_SECRET: ${ADMIN_SESSION_SECRET:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      AUTH_CONFIG_ENC_KEY: ${AUTH_CONFIG_ENC_KEY:-}
      AUTH_CONFIG_ENC_ACTIVE_KEY_ID: ${AUTH_CONFIG_ENC_ACTIVE_KEY_ID:-}
      INTERNAL_SERVICE_TOKEN: ${INTERNAL_SERVICE_TOKEN:-}
      # EID-1.2: public email domains no workspace may claim for single sign-on (comma-separated).
      # Blank keeps the built-in list (gmail.com, outlook.com, yahoo.com, …).
      APIOME_SSO_PUBLIC_DOMAINS: ${APIOME_SSO_PUBLIC_DOMAINS:-}
      # ── Agent upstream auth vault (AGX-2.2, #4534) ──────────────────────────────────────────
      # Master-key map that seals the upstream API credentials managed MCP toolsets present to
      # tenants' real APIs. Optional pass-through (empty ⇒ unset): without it the vault fails
      # closed — storing a credential is a 503 naming this variable. Production inherits it.
      # New credentials are sealed under the highest key version in the map, so rotating the
      # master key is "add a higher version". The ACTIVE_KEY_VERSION override is deliberately not
      # passed through: an empty value would fail integer parsing at startup.
      APIOME_UPSTREAM_CREDENTIAL_ENCRYPTION_KEYS: ${APIOME_UPSTREAM_CREDENTIAL_ENCRYPTION_KEYS:-}
      # ── Mock broker bindings (XPC-2.1, #5735) ───────────────────────────────────────────────
      # Seals the SASL credentials of tenants' own Kafka clusters (POST …/mock/broker-bindings).
      # Optional pass-through (empty ⇒ unset): a binding without SASL still works; storing one with a
      # credential is a 503 naming this variable.
      APIOME_BROKER_CREDENTIAL_ENCRYPTION_KEYS: ${APIOME_BROKER_CREDENTIAL_ENCRYPTION_KEYS:-}
      # The opt-in dev broker (`--profile broker`). Its exact host:port is exempt from the broker
      # address check; every other private address is refused unless ALLOW_PRIVATE is true. The
      # `redpanda` host only exists while the profile is active, so without it nothing is reachable
      # there and nothing waits on it.
      APIOME_MOCK_DEV_BROKER_BOOTSTRAP: ${APIOME_MOCK_DEV_BROKER_BOOTSTRAP:-redpanda:9092}
      APIOME_MOCK_BROKER_ALLOW_PRIVATE: ${APIOME_MOCK_BROKER_ALLOW_PRIVATE:-false}
      # Slate 10.2 (private-suite#120): seals CDN purge credentials. Empty ⇒ attaching a CDN is a
      # 409 naming this variable.
      APIOME_SLATE_CDN_CREDENTIAL_ENCRYPTION_KEYS: ${APIOME_SLATE_CDN_CREDENTIAL_ENCRYPTION_KEYS:-}
      # ── Linked-account token encryption (#4960) ─────────────────────────────────────────────
      # Master-key map that seals the OAuth tokens and personal access tokens of linked accounts
      # (external_auth_providers). apiome-ui seals them when a user links an account or saves a
      # PAT; this service opens them to scan and import repositories — so the value must match
      # apiome-ui's byte for byte. Optional pass-through (empty ⇒ unset): without it rows written
      # before the upgrade still read, but a sealed token reads as "no token". Production inherits
      # it. The ACTIVE_KEY_VERSION override is not passed through, for the reason given above.
      APIOME_LINKED_ACCOUNT_TOKEN_ENCRYPTION_KEYS: ${APIOME_LINKED_ACCOUNT_TOKEN_ENCRYPTION_KEYS:-}
      # ── Document store (COA-5.12, #7088) ────────────────────────────────────────────────────
      # `db` (default) keeps objects in Postgres; set APIOME_DOCUMENT_STORE=s3 to use the bundled
      # MinIO (the defaults below point at it), or any S3-compatible service by overriding them.
      # `filesystem` needs APIOME_DOCUMENT_STORE_PATH on a mounted volume.
      APIOME_DOCUMENT_STORE: ${APIOME_DOCUMENT_STORE:-db}
      APIOME_DOCUMENT_STORE_PREFIX: ${APIOME_DOCUMENT_STORE_PREFIX:-apiome}
      APIOME_DOCUMENT_STORE_PATH: ${APIOME_DOCUMENT_STORE_PATH:-}
      APIOME_DOCUMENT_STORE_BUCKET: ${APIOME_DOCUMENT_STORE_BUCKET:-apiome}
      APIOME_DOCUMENT_STORE_REGION: ${APIOME_DOCUMENT_STORE_REGION:-us-east-1}
      APIOME_DOCUMENT_STORE_ENDPOINT_URL: ${APIOME_DOCUMENT_STORE_ENDPOINT_URL:-http://minio:9000}
      APIOME_DOCUMENT_STORE_ADDRESSING_STYLE: ${APIOME_DOCUMENT_STORE_ADDRESSING_STYLE:-path}
      # The bundled MinIO is on the private compose network, which the SSRF guard refuses by
      # default; this lifts it for the document-store endpoint only.
      APIOME_DOCUMENT_STORE_ALLOW_PRIVATE: ${APIOME_DOCUMENT_STORE_ALLOW_PRIVATE:-true}
      # Per-tenant buckets (COA-5.15): off unless you turn them on. The second setting lets a
      # workspace point at a store on this private network (the bundled MinIO, for trying it out).
      APIOME_DOCUMENT_STORE_ALLOW_TENANT_BUCKETS: ${APIOME_DOCUMENT_STORE_ALLOW_TENANT_BUCKETS:-false}
      APIOME_DOCUMENT_STORE_TENANT_ALLOW_PRIVATE: ${APIOME_DOCUMENT_STORE_TENANT_ALLOW_PRIVATE:-false}
      APIOME_DOCUMENT_STORE_ACCESS_KEY_ID: ${APIOME_DOCUMENT_STORE_ACCESS_KEY_ID:-${MINIO_ROOT_USER:-apiome}}
      APIOME_DOCUMENT_STORE_SECRET_ACCESS_KEY: ${APIOME_DOCUMENT_STORE_SECRET_ACCESS_KEY:-${MINIO_ROOT_PASSWORD:-apiome_local_dev}}
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      seed:
        condition: service_completed_successfully
      # The bucket must exist before REST can write to it when APIOME_DOCUMENT_STORE=s3.
      minio-init:
        condition: service_completed_successfully
    # Readiness probe (#3617): /readyz verifies the database is reachable (503 otherwise), so
    # orchestration only marks `rest` healthy once it can actually serve traffic. /livez exists for
    # a process-only liveness check that ignores the database.
    healthcheck:
      test:
        - "CMD-SHELL"
        - "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/readyz', timeout=4)\""
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 15s
    networks:
      - apiome-mcp

  # MinIO: S3-compatible object storage for the document store (COA-5.12, #7088). Inside the stack
  # it is `minio:9000`; from the host the API is localhost:9000 and the web console localhost:9001
  # (sign in with MINIO_ROOT_USER / MINIO_ROOT_PASSWORD). REST only uses it when
  # APIOME_DOCUMENT_STORE=s3. The dev credentials below are local-only defaults.
  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-apiome}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-apiome_local_dev}
    volumes:
      - apiome_minio_data:/data
    ports:
      - "${MINIO_API_PUBLISH_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PUBLISH_PORT:-9001}:9001"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 5s
    networks:
      - apiome-mcp

  # One-shot bucket creation (idempotent: --ignore-existing). Runs after MinIO is healthy, then exits.
  minio-init:
    image: minio/mc:RELEASE.2025-04-16T18-13-26Z
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        mc alias set local http://minio:9000 "$$MINIO_ROOT_USER" "$$MINIO_ROOT_PASSWORD" &&
        mc mb --ignore-existing "local/$$APIOME_DOCUMENT_STORE_BUCKET"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-apiome}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-apiome_local_dev}
      APIOME_DOCUMENT_STORE_BUCKET: ${APIOME_DOCUMENT_STORE_BUCKET:-apiome}
    depends_on:
      minio:
        condition: service_healthy
    restart: "no"
    networks:
      - apiome-mcp

  mcp:
    build:
      context: .
      dockerfile: apiome-mcp/Dockerfile
    ports:
      - "${APIOME_MCP_HTTP_PORT:-8765}:${APIOME_MCP_HTTP_PORT:-8765}"
    environment:
      APIOME_MCP_DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-apiome_local_dev}@postgres:5432/${POSTGRES_DB:-apiome}
      APIOME_MCP_INTERNAL_SECRET: ${APIOME_MCP_INTERNAL_SECRET:-apiome-local-dev-secret-min-16}
      APIOME_MCP_HTTP_HOST: 0.0.0.0
      APIOME_MCP_HTTP_PORT: ${APIOME_MCP_HTTP_PORT:-8765}
      # AGX-2.4: toolsets with target=mock route tools/call to the mock service below.
      APIOME_MCP_MOCK_PUBLIC_BASE_URL: ${APIOME_MOCK_PUBLIC_BASE_URL:-http://localhost:8775}
      # AGX-2.1: the agent runtime (/agent/mcp) calls the mock from inside the compose network.
      APIOME_MCP_MOCK_INVOCATION_BASE_URL: ${APIOME_MCP_MOCK_INVOCATION_BASE_URL:-http://mock:8775}
      # AGX-2.1: opens the AGX-2.2 upstream vault; must match the rest service's value.
      APIOME_UPSTREAM_CREDENTIAL_ENCRYPTION_KEYS: ${APIOME_UPSTREAM_CREDENTIAL_ENCRYPTION_KEYS:-}
      # MFX-40.1: export.targets / version.export call rest's internal export routes with its token.
      APIOME_MCP_REST_INTERNAL_URL: ${APIOME_MCP_REST_INTERNAL_URL:-http://rest:8000}
      APIOME_MCP_REST_INTERNAL_SERVICE_TOKEN: ${INTERNAL_SERVICE_TOKEN:-}
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      seed:
        condition: service_completed_successfully
    # Health probe (#3617): the MCP HTTP server exposes GET /health; wiring it into compose makes a
    # crashed/unready MCP visible to `docker compose ps` / `--wait` instead of silently "up".
    healthcheck:
      test:
        - "CMD-SHELL"
        - "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:${APIOME_MCP_HTTP_PORT:-8765}/health', timeout=4)\""
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 15s
    networks:
      - apiome-mcp

  # apiome-mock hosted mock runtime. Serves published, mock-enabled versions at
  # /{tenant}/{project}/{version}/{path}. Exercised by the golden-path smoke test (#4421).
  mock:
    build:
      context: .
      dockerfile: apiome-mock/Dockerfile
    ports:
      - "${APIOME_MOCK_HTTP_PORT:-8775}:8775"
    environment:
      APIOME_MOCK_DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-apiome_local_dev}@postgres:5432/${POSTGRES_DB:-apiome}
      APIOME_MOCK_HTTP_HOST: 0.0.0.0
      APIOME_MOCK_HTTP_PORT: 8775
      # Gates the internal /__preview__ endpoint apiome-rest calls for dry-run renders (#5528,
      # MSC-1.2). Must match the value given to `rest`; unset disables the endpoint entirely.
      APIOME_MOCK_INTERNAL_TOKEN: ${APIOME_MOCK_INTERNAL_TOKEN:-apiome-local-dev-preview-token}
      # The opt-in dev broker (XPC-2.1, #5735). /health adds `"broker": "reachable"` while the
      # `broker` profile's Redpanda is up; without the profile the host does not resolve and /health
      # is unchanged. The mock never waits on it.
      APIOME_MOCK_DEV_BROKER_BOOTSTRAP: ${APIOME_MOCK_DEV_BROKER_BOOTSTRAP:-redpanda:9092}
      # Kafka mock producer (XPC-2.2, #5736). The mock opens bound brokers' SASL credentials with
      # the same key map rest seals them with (must match rest's value byte for byte), and applies
      # the same broker address rule, including the private-address escape hatch.
      APIOME_BROKER_CREDENTIAL_ENCRYPTION_KEYS: ${APIOME_BROKER_CREDENTIAL_ENCRYPTION_KEYS:-}
      APIOME_MOCK_BROKER_ALLOW_PRIVATE: ${APIOME_MOCK_BROKER_ALLOW_PRIVATE:-false}
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      seed:
        condition: service_completed_successfully
    healthcheck:
      test:
        - "CMD-SHELL"
        - "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8775/health', timeout=4)\""
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 15s
    networks:
      - apiome-mcp

  # Opt-in dev broker for AsyncAPI mocks (XPC-2.1, #5735): `docker compose --profile broker up`.
  # A single-node Redpanda speaking the Kafka API, unauthenticated, in dev-container mode (one core,
  # 512 MiB). Inside the stack it is `redpanda:9092` (what rest and mock are pre-wired with); from
  # the host it is `localhost:19092`. Nothing depends on it, so the default stack never starts or
  # waits for it. Data is not persisted.
  redpanda:
    image: docker.redpanda.com/redpandadata/redpanda:v24.2.7
    profiles:
      - broker
    command:
      - redpanda
      - start
      - --mode=dev-container
      - --smp=1
      - --memory=512M
      - --kafka-addr=internal://0.0.0.0:9092,external://0.0.0.0:19092
      - --advertise-kafka-addr=internal://redpanda:9092,external://localhost:${APIOME_DEV_BROKER_HOST_PORT:-19092}
    ports:
      - "${APIOME_DEV_BROKER_HOST_PORT:-19092}:19092"
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster health | grep -E 'Healthy:.+true' || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 24
      start_period: 10s
    networks:
      - apiome-mcp

volumes:
  apiome_postgres_data:
  apiome_minio_data:

networks:
  apiome-mcp:
    driver: bridge
