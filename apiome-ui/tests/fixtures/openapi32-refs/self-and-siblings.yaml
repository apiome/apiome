# OpenAPI 3.2.0 $self-based references and $ref sibling overrides (OA6, #3503).
openapi: 3.2.0
$self: https://api.example.com/specs/orders.yaml
info:
  title: Orders API
  version: 1.0.0
paths:
  /orders:
    get:
      operationId: listOrders
      responses:
        "200":
          description: Orders
          content:
            application/json:
              schema:
                $ref: https://api.example.com/specs/orders.yaml#/components/schemas/Order
components:
  schemas:
    Customer:
      type: object
      description: A customer
      properties:
        id:
          type: string
    Address:
      type: object
      properties:
        line1:
          type: string
    Order:
      type: object
      properties:
        customer:
          $ref: https://api.example.com/specs/orders.yaml#/components/schemas/Customer
          summary: Billing customer
          description: Overrides Customer.description for this field
        shipping:
          $ref: orders.yaml#/components/schemas/Address
        billing:
          $ref: ./orders.yaml#/components/schemas/Address
        local:
          $ref: '#/components/schemas/Address'
        supplier:
          $ref: common.yaml#/components/schemas/Customer
    Composite:
      allOf:
        - $ref: orders.yaml#/components/schemas/Customer
          description: Composite override
        - type: object
          properties:
            extra:
              type: string
    Loop:
      allOf:
        - $ref: orders.yaml#/components/schemas/Loop2
        - type: object
          properties:
            a:
              type: string
    Loop2:
      allOf:
        - $ref: orders.yaml#/components/schemas/Loop
        - type: object
          properties:
            b:
              type: string
