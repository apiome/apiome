# `route:` is indented one column past `match:`, so the http rule's block mapping cannot
# be parsed.
apiVersion: networking.istio.io/v1
kind: VirtualService
metadata:
  name: broken
  namespace: storefront
spec:
  hosts:
    - broken.example.com
  http:
    - match:
        - uri:
           prefix: /broken
       route:
        - destination:
            host: broken.storefront.svc.cluster.local
