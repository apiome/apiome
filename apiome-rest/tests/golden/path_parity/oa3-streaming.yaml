openapi: 3.2.0
info:
  title: Streaming parity
  version: 1.0.0
paths:
  /logs:
    get:
      operationId: streamLogs
      responses:
        "200":
          description: One log event per line
          content:
            application/jsonl:
              itemSchema:
                $ref: '#/components/schemas/LogEvent'
  /logs/import:
    post:
      operationId: importLogs
      requestBody:
        content:
          application/json-seq:
            itemSchema:
              type: object
              properties:
                line:
                  type: string
                level:
                  type: string
      responses:
        "202":
          description: Accepted
  /events:
    get:
      operationId: watchEvents
      responses:
        "200":
          description: Server-Sent Events
          content:
            text/event-stream:
              itemSchema:
                type: string
  /problems:
    get:
      operationId: streamProblems
      responses:
        "200":
          description: A stream of problems
          content:
            application/problem+json:
              itemSchema:
                $ref: '#/components/schemas/Problem'
  /legacy:
    get:
      operationId: legacyLogs
      responses:
        "200":
          description: A JSON Lines body described as a whole
          content:
            application/jsonl:
              schema:
                $ref: '#/components/schemas/LogEvent'
components:
  schemas:
    LogEvent:
      type: object
      properties:
        message:
          type: string
        at:
          type: string
          format: date-time
    Problem:
      type: object
      properties:
        title:
          type: string
