openapi: 3.2.0
$self: https://api.example.com/specs/orders.yaml
info:
  title: Self reference parity
  version: 1.0.0
paths: {}
components:
  schemas:
    Order:
      type: object
      properties:
        customer:
          $ref: https://api.example.com/specs/orders.yaml#/components/schemas/Customer
          summary: Billing customer
          description: Overrides Customer.description for this field
        shipping:
          $ref: ./orders.yaml#/components/schemas/Address
        partner:
          $ref: common.yaml#/components/schemas/Partner
        local:
          $ref: '#/components/schemas/Address'
    Customer:
      type: object
      description: A customer
      properties:
        name:
          type: string
    Address:
      type: object
      properties:
        street:
          type: string
