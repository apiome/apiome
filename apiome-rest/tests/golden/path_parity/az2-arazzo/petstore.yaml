openapi: 3.1.0
info:
  title: Petstore
  version: 1.0.0
paths:
  /pets:
    get:
      operationId: listPets
      responses:
        "200":
          description: Pets
  /pets/{petId}:
    get:
      operationId: getPet
      responses:
        "200":
          description: A pet
    delete:
      operationId: deletePet
      responses:
        "204":
          description: Removed
