type Query {
  user(id: ID!): User
  users(first: Int = 10): [User!]!
}

type Mutation {
  createUser(input: CreateUserInput!): User!
}

type User {
  id: ID!
  name: String!
  email: String
  status: Status!
  nickname: String
}

enum Status {
  ACTIVE
  SUSPENDED
}

input CreateUserInput {
  name: String!
  email: String
}

union SearchResult = User
