# Apiome construct fixture — OpenAPI 3.0 (COA-2.1, #7044).
# One document that carries every construct the 3.0 column of the construct matrix tracks.
openapi: 3.0.3
info:
  title: Construct audit (3.0)
  version: 1.0.0
  description: Every OpenAPI 3.0 construct the losslessness audit tracks.
  termsOfService: https://example.com/terms
  contact:
    name: API team
    email: api@example.com
  license:
    name: Apache 2.0
    url: https://www.apache.org/licenses/LICENSE-2.0.html
  x-audience: internal
servers:
  - url: https://{region}.example.com/v1
    description: Regional endpoint
    variables:
      region:
        default: eu
        enum: [eu, us]
        x-region-owner: platform
tags:
  - name: pets
    description: Pet operations
    externalDocs:
      url: https://example.com/docs/pets
    x-tag-color: green
externalDocs:
  description: Full guide
  url: https://example.com/docs
security:
  - apiKey: []
x-document-owner: platform
paths:
  /pets:
    summary: The pet collection
    description: Shared across every method on /pets.
    servers:
      - url: https://pets.example.com/v1
    parameters:
      - $ref: '#/components/parameters/TraceId'
    x-path-note: collection
    get:
      operationId: listPets
      summary: List pets
      description: Lists pets, newest first.
      tags: [pets]
      deprecated: true
      x-rate-limit: 100
      externalDocs:
        url: https://example.com/docs/list-pets
      security:
        - apiKey: []
        - {}
      servers:
        - url: https://read.example.com/v1
      parameters:
        - name: filter
          in: query
          style: deepObject
          explode: true
          allowEmptyValue: false
          schema:
            type: object
            additionalProperties:
              type: string
          example:
            kind: cat
        - name: tags
          in: query
          style: pipeDelimited
          explode: false
          schema:
            type: array
            items:
              type: string
          examples:
            two:
              summary: Two tags
              value: [a, b]
        - name: coords
          in: query
          content:
            application/json:
              schema:
                type: object
                properties:
                  lat: {type: number}
                  long: {type: number}
      responses:
        '200':
          description: A page of pets.
          headers:
            X-Rate-Limit-Remaining:
              description: Calls left in the window.
              schema:
                type: integer
                minimum: 0
              example: 99
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Pet'
              example:
                - id: 1
                  name: Rex
            application/xml:
              schema:
                type: array
                xml:
                  name: pets
                  wrapped: true
                items:
                  $ref: '#/components/schemas/Pet'
            text/event-stream:
              schema:
                type: string
            application/x-ndjson:
              schema:
                $ref: '#/components/schemas/Pet'
          links:
            GetPetById:
              operationId: getPet
              parameters:
                petId: $response.body#/0/id
              description: The first pet on the page.
        default:
          $ref: '#/components/responses/Error'
    post:
      operationId: createPet
      tags: [pets]
      requestBody:
        $ref: '#/components/requestBodies/NewPet'
      callbacks:
        petAdopted:
          '{$request.body#/callbackUrl}':
            post:
              requestBody:
                content:
                  application/json:
                    schema:
                      $ref: '#/components/schemas/Pet'
              responses:
                '204':
                  description: Callback received.
          x-callback-note: retried three times
      responses:
        '201':
          description: Created.
  /pets/{petId}:
    $ref: '#/components/x-path-items/PetById'
  /pets/{petId}/photo:
    put:
      operationId: uploadPhoto
      parameters:
        - name: petId
          in: path
          required: true
          schema:
            type: integer
            format: int64
            minimum: 1
            exclusiveMinimum: false
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
                meta:
                  type: object
            encoding:
              file:
                contentType: image/png, image/jpeg
                headers:
                  X-Checksum:
                    schema:
                      type: string
              meta:
                contentType: application/json
                style: form
                explode: true
          application/octet-stream:
            schema:
              type: string
              format: binary
      responses:
        '204':
          description: Uploaded.
components:
  x-path-items:
    PetById:
      get:
        responses:
          '200':
            description: One pet.
  schemas:
    Pet:
      type: object
      required: [id, name, kind]
      discriminator:
        propertyName: kind
        mapping:
          cat: '#/components/schemas/Cat'
          dog: '#/components/schemas/Dog'
      externalDocs:
        url: https://example.com/docs/pet
      x-entity: true
      properties:
        id:
          type: integer
          format: int64
          readOnly: true
        name:
          type: string
          minLength: 1
          maxLength: 64
          pattern: '^[A-Za-z ]+$'
          title: Pet name
        kind:
          type: string
          enum: [cat, dog]
        nickname:
          type: string
          nullable: true
          default: null
        password:
          type: string
          writeOnly: true
        weight:
          type: number
          minimum: 0
          maximum: 100
          exclusiveMaximum: true
          multipleOf: 0.5
        tags:
          type: array
          minItems: 0
          maxItems: 10
          uniqueItems: true
          items:
            type: string
        attributes:
          type: object
          minProperties: 1
          maxProperties: 20
          additionalProperties:
            type: string
        legacyCode:
          type: string
          deprecated: true
          example: A-1
    Cat:
      allOf:
        - $ref: '#/components/schemas/Pet'
        - type: object
          properties:
            indoor:
              type: boolean
    Dog:
      allOf:
        - $ref: '#/components/schemas/Pet'
        - type: object
          properties:
            breed:
              type: string
              nullable: true
    PetOrError:
      oneOf:
        - $ref: '#/components/schemas/Pet'
        - $ref: '#/components/schemas/Error'
    AnyId:
      anyOf:
        - type: integer
        - type: string
    NotEmpty:
      not:
        type: string
        maxLength: 0
    MaybePet:
      nullable: true
      allOf:
        - $ref: '#/components/schemas/Pet'
    Error:
      type: object
      properties:
        code:
          type: integer
        message:
          type: string
  responses:
    Error:
      description: An error.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
  parameters:
    TraceId:
      name: X-Trace-Id
      in: header
      schema:
        type: string
        format: uuid
  requestBodies:
    NewPet:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Pet'
  headers:
    RateLimit:
      schema:
        type: integer
  examples:
    Rex:
      summary: A dog
      value:
        id: 1
        name: Rex
        kind: dog
  links:
    PetOwner:
      operationRef: '#/paths/~1pets~1{petId}/get'
  callbacks:
    Audit:
      '{$request.header.X-Audit-Url}':
        post:
          responses:
            '200':
              description: OK
  securitySchemes:
    apiKey:
      type: apiKey
      in: header
      name: X-API-Key
    oauth:
      type: oauth2
      flows:
        authorizationCode:
          authorizationUrl: https://auth.example.com/authorize
          tokenUrl: https://auth.example.com/token
          scopes:
            pets:read: Read pets
