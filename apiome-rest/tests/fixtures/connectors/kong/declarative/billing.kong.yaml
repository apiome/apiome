_format_version: '3.0'
services:
- name: billing
  protocol: https
  host: billing.internal
  port: 443
  path: /v1
  tags:
  - owner:payments
  - tier:gold
  retries: 5
  connect_timeout: 60000
  read_timeout: 60000
  write_timeout: 60000
  enabled: true
  plugins:
  - name: key-auth
    enabled: true
    config:
      anonymous: null
      hide_credentials: true
      key_in_body: false
      key_in_header: true
      key_in_query: false
      key_names:
      - x-api-key
      run_on_preflight: true
  routes:
  - name: billing-invoice
    protocols:
    - https
    methods:
    - GET
    hosts:
    - api.example.com
    paths:
    - ~/billing/invoices/(?<invoice_id>[^/]+)$
    strip_path: false
    preserve_host: false
    path_handling: v0
    regex_priority: 10
    https_redirect_status_code: 426
    request_buffering: true
    response_buffering: true
  - name: billing-invoices
    protocols:
    - https
    methods:
    - GET
    - POST
    hosts:
    - api.example.com
    paths:
    - /billing/invoices
    strip_path: true
    preserve_host: false
    path_handling: v0
    regex_priority: 0
    https_redirect_status_code: 426
    request_buffering: true
    response_buffering: true
plugins:
- name: correlation-id
  enabled: true
  config:
    echo_downstream: false
    generator: uuid#counter
    header_name: Kong-Request-ID
