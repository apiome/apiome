_format_version: '3.0'
services:
- name: users
  protocol: http
  host: users.internal
  port: 80
  retries: 5
  connect_timeout: 60000
  read_timeout: 60000
  write_timeout: 60000
  enabled: true
  plugins:
  - name: acme-audit-trail
    enabled: true
    config:
      include_bodies: false
      sink: s3://acme-audit/users
  routes:
  - name: users-admin
    protocols:
    - https
    methods:
    - GET
    - PATCH
    hosts:
    - id.example.com
    paths:
    - /users/admin
    strip_path: false
    preserve_host: false
    path_handling: v0
    regex_priority: 0
    https_redirect_status_code: 426
    request_buffering: true
    response_buffering: true
  - name: users-me
    protocols:
    - https
    methods:
    - GET
    hosts:
    - id.example.com
    paths:
    - /users/me
    strip_path: false
    preserve_host: false
    path_handling: v0
    regex_priority: 0
    https_redirect_status_code: 426
    request_buffering: true
    response_buffering: true
plugins:
- name: correlation-id
  enabled: true
  config:
    echo_downstream: false
    generator: uuid#counter
    header_name: Kong-Request-ID
