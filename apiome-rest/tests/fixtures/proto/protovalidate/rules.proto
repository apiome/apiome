// Protovalidate fixture set — XPC-3.3 (#5743). One message per rule family, so no family can
// claim support without a fixture (tests/test_proto_validate.py asserts the coverage).
syntax = "proto3";

package fixtures.protovalidate.v1;

import "buf/validate/validate.proto";
import "google/protobuf/any.proto";
import "google/protobuf/duration.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

// The acceptance-criteria service: a unary method whose request carries `min_len = 3`.
service Accounts {
  rpc CreateAccount(CreateAccountRequest) returns (Account);
}

message CreateAccountRequest {
  string handle = 1 [(buf.validate.field).string.min_len = 3];
  string email = 2 [
    (buf.validate.field).required = true,
    (buf.validate.field).string.email = true
  ];
  int32 seats = 3 [(buf.validate.field).int32 = {gte: 1, lte: 500}];
}

message Account {
  string id = 1 [(buf.validate.field).string.uuid = true];
  string handle = 2;
}

enum Tier {
  TIER_UNSPECIFIED = 0;
  TIER_FREE = 1;
  TIER_PAID = 2;
}

// --- required (field and oneof) ---------------------------------------------------------

message RequiredFixture {
  string name = 1 [(buf.validate.field).required = true];
  optional int32 count = 2 [(buf.validate.field).required = true];
  repeated string tags = 3 [(buf.validate.field).required = true];
  Account account = 4 [(buf.validate.field).required = true];
  oneof contact {
    option (buf.validate.oneof).required = true;
    string phone = 5;
    string address = 6;
  }
  oneof nickname {
    string short_name = 7;
    string long_name = 8;
  }
}

// --- string -----------------------------------------------------------------------------

message StringFixture {
  string min_len = 1 [(buf.validate.field).string.min_len = 3];
  string max_len = 2 [(buf.validate.field).string.max_len = 64];
  string len = 3 [(buf.validate.field).string.len = 8];
  string pattern = 4 [(buf.validate.field).string.pattern = "^[a-z]+(-[a-z]+)*$"];
  string const = 5 [(buf.validate.field).string.const = "fixed"];
  string in = 6 [(buf.validate.field).string = {in: ["red", "green", "blue"]}];
  string email = 7 [(buf.validate.field).string.email = true];
  string hostname = 8 [(buf.validate.field).string.hostname = true];
  string ipv4 = 9 [(buf.validate.field).string.ipv4 = true];
  string ipv6 = 10 [(buf.validate.field).string.ipv6 = true];
  string uri = 11 [(buf.validate.field).string.uri = true];
  string uri_ref = 12 [(buf.validate.field).string.uri_ref = true];
  string uuid = 13 [(buf.validate.field).string.uuid = true];
  // No JSON-Schema analogue: kept verbatim.
  string prefix = 14 [(buf.validate.field).string.prefix = "acct_"];
  string suffix = 15 [(buf.validate.field).string.suffix = ".json"];
  string contains = 16 [(buf.validate.field).string.contains = "@"];
  string not_contains = 17 [(buf.validate.field).string.not_contains = " "];
  string not_in = 18 [(buf.validate.field).string = {not_in: ["root", "admin"]}];
  string max_bytes = 19 [(buf.validate.field).string.max_bytes = 256];
  string ip = 20 [(buf.validate.field).string.ip = true];
  // Mapped and verbatim rules on one field.
  string slug = 21 [(buf.validate.field).string = {min_len: 2, max_len: 40, prefix: "s-"}];
}

// --- numeric: one field per family -------------------------------------------------------

message NumericFixture {
  float float_range = 1 [(buf.validate.field).float = {gt: 0, lte: 1}];
  double double_range = 2 [(buf.validate.field).double = {gte: -90, lte: 90}];
  int32 int32_range = 3 [(buf.validate.field).int32 = {gte: 1, lt: 100}];
  int64 int64_range = 4 [(buf.validate.field).int64 = {gt: 0, lte: 1000000}];
  uint32 uint32_in = 5 [(buf.validate.field).uint32 = {in: [1, 2, 4, 8]}];
  uint64 uint64_gt = 6 [(buf.validate.field).uint64.gt = 0];
  sint32 sint32_const = 7 [(buf.validate.field).sint32.const = -1];
  sint64 sint64_lte = 8 [(buf.validate.field).sint64.lte = 0];
  fixed32 fixed32_gte = 9 [(buf.validate.field).fixed32.gte = 10];
  fixed64 fixed64_lt = 10 [(buf.validate.field).fixed64.lt = 4096];
  sfixed32 sfixed32_gt = 11 [(buf.validate.field).sfixed32.gt = -5];
  sfixed64 sfixed64_range = 12 [(buf.validate.field).sfixed64 = {gte: -10, lte: 10}];
  // Kept verbatim: `not_in`, `finite`, a reversed ("outside") range and a bound beyond 2^53.
  int32 not_in = 13 [(buf.validate.field).int32 = {not_in: [0, 13]}];
  double finite = 14 [(buf.validate.field).double.finite = true];
  int32 outside = 15 [(buf.validate.field).int32 = {gt: 100, lt: 10}];
  int64 huge = 16 [(buf.validate.field).int64.lt = 9007199254740993];
}

// --- bool / bytes / enum ----------------------------------------------------------------

message BoolFixture {
  bool accepted = 1 [(buf.validate.field).bool.const = true];
}

message BytesFixture {
  bytes digest = 1 [(buf.validate.field).bytes = {len: 32}];
  bytes payload = 2 [(buf.validate.field).bytes = {min_len: 1, max_len: 1024}];
}

message EnumFixture {
  Tier defined_only = 1 [(buf.validate.field).enum.defined_only = true];
  Tier in = 2 [(buf.validate.field).enum = {in: [1, 2]}];
  Tier not_in = 3 [(buf.validate.field).enum = {not_in: [0]}];
}

// --- repeated / map ---------------------------------------------------------------------

message RepeatedFixture {
  repeated string tags = 1 [(buf.validate.field).repeated = {min_items: 1, max_items: 10, unique: true}];
  repeated string codes = 2 [(buf.validate.field).repeated.items = {string: {len: 3}}];
}

message MapFixture {
  map<string, int32> quotas = 1 [(buf.validate.field).map = {
    min_pairs: 1
    max_pairs: 8
    keys: {string: {min_len: 1}}
    values: {int32: {gte: 0}}
  }];
}

// --- well-known types -------------------------------------------------------------------

message AnyFixture {
  google.protobuf.Any detail = 1 [(buf.validate.field).any = {in: ["type.googleapis.com/fixtures.protovalidate.v1.Account"]}];
}

message DurationFixture {
  google.protobuf.Duration timeout = 1 [(buf.validate.field).duration = {gte: {seconds: 1}, lte: {seconds: 300}}];
}

message FieldMaskFixture {
  google.protobuf.FieldMask update_mask = 1 [(buf.validate.field).field_mask = {in: ["handle", "email"]}];
}

message TimestampFixture {
  google.protobuf.Timestamp created_at = 1 [(buf.validate.field).timestamp.lt_now = true];
  google.protobuf.Timestamp expires_at = 2 [(buf.validate.field).timestamp = {gt_now: true, within: {seconds: 86400}}];
  google.protobuf.Timestamp not_before = 3 [(buf.validate.field).timestamp.gte = {seconds: 1700000000}];
}

// --- CEL: recorded, never evaluated ------------------------------------------------------

message CelFixture {
  option (buf.validate.message).cel = {
    id: "window.order"
    message: "start must be before end"
    expression: "this.start < this.end"
  };
  option (buf.validate.message).cel_expression = "this.start >= 0";

  int32 start = 1;
  int32 end = 2 [(buf.validate.field).cel = {
    id: "end.even"
    message: "end must be even"
    expression: "this % 2 == 0"
  }];
  string label = 3 [
    (buf.validate.field).cel_expression = "this.size() > 0",
    (buf.validate.field).string.max_len = 20
  ];
}
