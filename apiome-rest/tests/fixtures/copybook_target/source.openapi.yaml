openapi: 3.1.0
info:
  title: Order
  version: 1.0.0
paths:
  /orders/{orderId}:
    get:
      operationId: getOrder
      parameters:
        - name: orderId
          in: path
          required: true
          schema: {type: string}
      responses:
        '200':
          description: The order.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Order'}
components:
  schemas:
    Order:
      type: object
      required: [orderId, total, shipTo, lines]
      properties:
        orderId: {type: string, maxLength: 12}
        total: {type: number, multipleOf: 0.01, maximum: 9999999.99}
        discountRate: {type: number}
        shipTo: {$ref: '#/components/schemas/Address'}
        lines:
          type: array
          maxItems: 50
          items: {$ref: '#/components/schemas/OrderLine'}
        notes:
          type: array
          items: {type: string, maxLength: 80}
        customerLoyaltyProgramMembershipIdentifier: {type: string, maxLength: 20}
    Address:
      type: object
      required: [street, city]
      properties:
        street: {type: string, maxLength: 40}
        city: {type: string, maxLength: 30}
        postalCode: {type: string, maxLength: 10}
        geo: {$ref: '#/components/schemas/GeoPoint'}
    GeoPoint:
      type: object
      properties:
        latitude: {type: number, multipleOf: 0.000001, minimum: -90, maximum: 90}
        longitude: {type: number, multipleOf: 0.000001, minimum: -180, maximum: 180}
    OrderLine:
      type: object
      required: [sku, quantity, unitPrice]
      properties:
        sku: {type: string, maxLength: 16}
        quantity: {type: integer, format: int32, minimum: 1, maximum: 9999}
        unitPrice: {type: number, multipleOf: 0.01, maximum: 99999.99}
        warehouseBinLocationReferenceCodeForPicking: {type: string, maxLength: 8}
